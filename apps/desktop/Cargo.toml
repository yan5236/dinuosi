[package]
name = "dinuosi-desktop"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "dinuosi"
path = "src/main.rs"

[dependencies]
dinuosi-core.workspace = true
dinuosi-command.workspace = true
dinuosi-icons.workspace = true
gpui.workspace = true
unicode-segmentation = "1.13"
sys-locale = "=0.3.2"
serde_json.workspace = true
image = { version = "0.25", default-features = false }
rodio = { version = "=0.21.1", default-features = false, features = ["playback"] }

[target.'cfg(target_os = "windows")'.dependencies]
dinuosi-cursor = { path = "../../crates/cursor" }
resvg = { version = "=0.45.1", default-features = false }

[build-dependencies]
embed-resource = "=3.0.11"

[dev-dependencies]
gpui = { workspace = true, features = ["test-support"] }

[lints]
workspace = true
