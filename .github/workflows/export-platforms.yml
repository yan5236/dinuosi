name: Export platform verification

on:
  workflow_dispatch:
    inputs:
      platform:
        description: Native platform to verify
        type: choice
        default: all
        options: [all, windows-2022, ubuntu-24.04, macos-14]
  push:
    branches: [main]
    paths:
      - 'crates/core/**'
      - 'apps/desktop/**'
      - 'tools/**'
      - 'distribution/**'
      - '.github/workflows/export-platforms.yml'
      - 'Cargo.*'
      - 'rust-toolchain.toml'

permissions:
  contents: read

jobs:
  export:
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(inputs.platform && inputs.platform != 'all' && format('["{0}"]', inputs.platform) || '["windows-2022","ubuntu-24.04","macos-14"]') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    env:
      CARGO_BUILD_JOBS: '2'
      DINUOSI_BUILD_JOBS: '2'
      PYTHONUTF8: '1'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Restore controlled Windows runtime
        if: runner.os == 'Windows'
        id: runtime-cache
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          key: windows-2022-x64-runtime-${{ hashFiles('distribution/**', 'tools/build*.sh', 'tools/prepare-media.ps1', 'tools/seal-runtime.ps1', '.github/workflows/export-platforms.yml') }}
          path: |
            target/debug/deps/runtime/ffmpeg/
            assets/audio/FluidR3_GM.sf2
            .local/distribution/runtime-manifest.json
      - name: Validate restored Windows runtime
        if: runner.os == 'Windows' && steps.runtime-cache.outputs.cache-hit == 'true'
        shell: pwsh
        run: |
          $lock = Get-Content distribution/inputs.lock.json -Raw | ConvertFrom-Json
          $manifest = Get-Content .local/distribution/runtime-manifest.json -Raw | ConvertFrom-Json
          if ((Get-FileHash assets/audio/FluidR3_GM.sf2).Hash.ToLowerInvariant() -ne $lock.soundfontSha256) { throw 'Cached soundfont hash mismatch' }
          if ($manifest.ffmpegVersion -ne $lock.ffmpegVersion) { throw 'Cached runtime version mismatch' }
          foreach ($file in $manifest.files) {
            if ((Get-FileHash "target/debug/deps/runtime/ffmpeg/$($file.name)").Hash.ToLowerInvariant() -ne $file.sha256) { throw "Cached runtime hash mismatch: $($file.name)" }
          }
      - name: Install Windows build tools
        if: runner.os == 'Windows' && steps.runtime-cache.outputs.cache-hit != 'true'
        id: msys
        uses: msys2/setup-msys2@ec48f7c5447b3140e2b088413ae3a55687bccb6e # v2
        with:
          msystem: MSYS
          path-type: inherit
          install: make patch gnupg binutils tar pkgconf diffutils
      - name: Rebuild controlled Windows runtime
        if: runner.os == 'Windows' && steps.runtime-cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force .local/ci-export | Out-Null
          $vs = & "${env:ProgramFiles(x86)}/Microsoft Visual Studio/Installer/vswhere.exe" -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          try {
            ./tools/prepare-media.ps1 -Build -MsysRoot '${{ steps.msys.outputs.msys2-location }}' -VcVars "$vs/VC/Auxiliary/Build/vcvars64.bat" 2>&1 | Tee-Object -FilePath .local/ci-export/prepare.log
          } catch {
            $_ | Out-String | Add-Content .local/ci-export/prepare.log
            throw
          }
      - name: Cache successfully built Windows runtime
        if: runner.os == 'Windows' && steps.runtime-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          key: ${{ steps.runtime-cache.outputs.cache-primary-key }}
          path: |
            target/debug/deps/runtime/ffmpeg/
            assets/audio/FluidR3_GM.sf2
            .local/distribution/runtime-manifest.json
      - name: Install Linux desktop and media build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake nasm pkg-config gnupg libasound2-dev libudev-dev libssl-dev libfontconfig1-dev libwayland-dev libxkbcommon-dev libxkbcommon-x11-dev libxcb1-dev libxcb-shape0-dev libxcb-xfixes0-dev libx11-dev libxi-dev libxrandr-dev libxcursor-dev libxinerama-dev libxrender-dev libvulkan-dev mesa-vulkan-drivers fonts-noto-cjk fonts-noto-core xvfb openbox x11-utils imagemagick
      - name: Install macOS media build dependencies
        if: runner.os == 'macOS'
        run: brew install cmake nasm pkg-config gnupg
      - name: Build controlled Unix runtime and prepare soundfont
        if: runner.os != 'Windows'
        run: |
          mkdir -p .local/ci-export
          set -o pipefail
          python tools/prepare-media-unix.py 2>&1 | tee .local/ci-export/prepare.log
      - name: Verify platform tooling boundaries
        run: python tools/test-platform-tools.py
      - name: Verify application exports and report tool capabilities
        run: python tools/verify-export-platform.py verify
      - name: Verify desktop build and event tests
        shell: bash
        run: |
          set -o pipefail
          cargo build -p dinuosi-desktop --locked 2>&1 | tee .local/ci-export/desktop-build.log
          cargo test -p dinuosi-desktop --locked -- --test-threads=1 2>&1 | tee .local/ci-export/desktop-tests.log
          cargo clippy --workspace --all-targets --locked -- -D warnings
          cargo fmt --all -- --check
      - name: Start native desktop on Linux virtual display
        if: runner.os == 'Linux'
        run: xvfb-run -a -s '-screen 0 1440x900x24' python tools/verify-desktop-startup.py
      - name: Start native desktop on Windows or macOS
        if: runner.os != 'Linux'
        run: python tools/verify-desktop-startup.py
      - name: Preserve platform evidence even on failure
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: export-${{ matrix.os }}
          retention-days: 14
          path: |
            .local/ci-export/
            .local/export-qa/
            .local/export-codecs-qa/
            .local/distribution/runtime-manifest.json
            .local/distribution/unix/runtime-manifest.json
