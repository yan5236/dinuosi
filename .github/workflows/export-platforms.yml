name: Export platform verification

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'crates/core/**'
      - 'tools/**'
      - 'distribution/**'
      - '.github/workflows/export-platforms.yml'
      - 'Cargo.*'
      - 'rust-toolchain.toml'

permissions:
  contents: read

jobs:
  export:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, ubuntu-24.04, macos-14]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    env:
      CARGO_BUILD_JOBS: '2'
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install Windows build tools
        if: runner.os == 'Windows'
        id: msys
        uses: msys2/setup-msys2@ec48f7c5447b3140e2b088413ae3a55687bccb6e # v2
        with:
          msystem: MSYS
          path-type: inherit
          install: make patch gnupg binutils tar pkgconf diffutils
      - name: Rebuild controlled Windows runtime
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force .local/ci-export | Out-Null
          $vs = & "${env:ProgramFiles(x86)}/Microsoft Visual Studio/Installer/vswhere.exe" -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          ./tools/prepare-media.ps1 -Build -MsysRoot '${{ steps.msys.outputs.msys2-location }}' -VcVars "$vs/VC/Auxiliary/Build/vcvars64.bat" *> .local/ci-export/prepare.log
      - name: Install Linux diagnostic tools
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Install macOS diagnostic tools
        if: runner.os == 'macOS'
        run: brew install ffmpeg
      - name: Prepare locked soundfont on Unix
        if: runner.os != 'Windows'
        run: python tools/verify-export-platform.py prepare-font
      - name: Verify application exports and report tool capabilities
        run: python tools/verify-export-platform.py verify
      - name: Preserve platform evidence even on failure
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: export-${{ matrix.os }}
          retention-days: 14
          path: |
            .local/ci-export/
            .local/export-qa/
            .local/export-codecs-qa/
            .local/distribution/runtime-manifest.json
