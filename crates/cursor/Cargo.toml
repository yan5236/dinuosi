[package]
name = "dinuosi-cursor"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[target.'cfg(target_os = "windows")'.dependencies]
raw-window-handle = "=0.6.2"
windows = { version = "=0.61.3", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_System_Threading", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }

# 原生光标 FFI 独立于媒体和 GUI；安全接口只允许在窗口所属线程使用。
[lints.rust]
unsafe_op_in_unsafe_fn = "deny"
[lints.clippy]
all = "warn"
